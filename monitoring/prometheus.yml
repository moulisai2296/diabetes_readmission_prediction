# Prometheus scrapes the API's /metrics page every 15s and stores the
# time series so Grafana can chart history.
global:
  scrape_interval: 15s

# Alerting rules (see monitoring/alerts.yml) — surfaced on the Prometheus Alerts page.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: readmission-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]   # 'api' resolves on the compose network
