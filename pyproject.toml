[project]
name = "diabeties-prediction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "evidently>=0.7.21",
    "fairlearn>=0.14.0",
    "fastapi>=0.136.3",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "lightgbm>=4.6.0",
    "markdown>=3.10.2",
    "matplotlib>=3.11.0",
    "mlflow>=3.13.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "pandas>=2.3.3",
    "pandera>=0.31.1",
    "prometheus-client>=0.25.0",
    "pytest>=9.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "uvicorn>=0.49.0",
    "xgboost>=3.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "python-pptx>=1.0.2",
]
